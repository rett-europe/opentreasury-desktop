name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_perf_gate:
        description: 'Also run the e2e perf gate against this ref'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      # TODO: add integration tests job once the scaffold is runnable (post npm install).
      # TODO: add the i18n missing-key coverage check from PRD-009 implementation.
      # TODO: add `electronegativity` check for Electron hardening (ADR-001 C7).

  e2e-perf:
    name: e2e · perf gate (main only)
    runs-on: ubuntu-latest
    # Gate on main pushes only — PRs can be flakier on shared GH runners.
    # Revisit after a week of data; tighten to PR-blocking if stable.
    # Also runnable on demand via the Actions tab (workflow_dispatch) for
    # branch-level validation of perf-seed / encrypted-workspace changes;
    # dispatch runs regardless of `quality` (lets us validate the perf gate
    # even when an unrelated unit-test flake is red).
    needs: quality
    if: |
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_perf_gate == 'true')
      )
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Install Playwright's Chromium + all system-level deps (libgtk, libgbm,
      # etc.) that Electron also needs to run on a headless Linux runner.
      - name: Install Playwright system dependencies
        run: npx playwright install --with-deps chromium

      # xvfb-run provides a virtual framebuffer so Electron can open a window
      # on a headless Linux runner. We force safeStorage to use Electron's
      # built-in "basic" fallback cipher (via OT_PASSWORD_STORE → command-line
      # switch in app/src/main/index.ts) so the seeder doesn't need a working
      # gnome-keyring + libsecret + DBus session on the runner.
      - name: Seed perf data + run e2e tests
        env:
          OT_PASSWORD_STORE: basic
        run: |
          xvfb-run --auto-servernum -- bash -c '
            npm run perf:seed -- --count=5000 --dir=perf-events && \
            npm run e2e
          '
